services:
  litellm:
    environment:
      RETAIL_PORTAL_ENABLED: "true"
      RETAIL_BILLING_ENABLED: "true"
      RETAIL_REGISTRATION_ENABLED: "true"
      RETAIL_MAX_PARALLEL: "10"
      RETAIL_DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?required}@db:5432/litellm
    volumes:
      - ../litellm/deploy/retail/config.yaml:/app/config.yaml:ro
      - ../litellm/litellm/proxy/retail:/app/.venv/lib/python3.13/site-packages/litellm/proxy/retail:ro
      - ../litellm/litellm/proxy/proxy_server.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/proxy_server.py:ro
      - ../litellm/litellm/proxy/_types.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/_types.py:ro
      - ../litellm/litellm/integrations/custom_logger.py:/app/.venv/lib/python3.13/site-packages/litellm/integrations/custom_logger.py:ro
      - ../litellm/litellm/litellm_core_utils/litellm_logging.py:/app/.venv/lib/python3.13/site-packages/litellm/litellm_core_utils/litellm_logging.py:ro
      - ../litellm/ui/litellm-dashboard/out:/app/.venv/lib/python3.13/site-packages/litellm/proxy/_experimental/out:ro
