services:
  litellm:
    image: litellm-retail-local:1.106.6-pool3.3.3
    build:
      context: ../litellm/deploy/retail
      dockerfile: Dockerfile.runtime
    stop_grace_period: 120s
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "${RETAIL_SERVER_WORKERS:-2}"]
    environment:
      REDIS_HOST: retail-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${RETAIL_REDIS_PASSWORD:?required}"
      RETAIL_REQUIRE_COORDINATION_REDIS: "${RETAIL_REQUIRE_COORDINATION_REDIS:-true}"
      DOCS_URL: "${DOCS_URL:-/docs}"
      ROOT_REDIRECT_URL: "${ROOT_REDIRECT_URL:-/ui/welcome/}"
      RETAIL_PORTAL_ENABLED: "true"
      RETAIL_BILLING_ENABLED: "true"
      RETAIL_REGISTRATION_ENABLED: "true"
      RETAIL_OPERATION_AUDIT_ENABLED: "${RETAIL_OPERATION_AUDIT_ENABLED:-false}"
      RETAIL_ORGANIZATIONS_ENABLED: "${RETAIL_ORGANIZATIONS_ENABLED:-false}"
      RETAIL_ORGANIZATION_DELEGATION_ENABLED: "${RETAIL_ORGANIZATION_DELEGATION_ENABLED:-false}"
      RETAIL_REPORT_EXPORT_ENABLED: "${RETAIL_REPORT_EXPORT_ENABLED:-false}"
      RETAIL_REPORT_DB_CONNECTIONS: "${RETAIL_REPORT_DB_CONNECTIONS:-2}"
      RETAIL_MAX_REQUEST_BYTES: "${RETAIL_MAX_REQUEST_BYTES:-33554432}"
      RETAIL_MAX_PARALLEL: "10"
      RETAIL_MAX_INFLIGHT: "512"
      RETAIL_DB_MAX_CONNECTIONS: "16"
      RETAIL_DB_DIAGNOSTIC_CONNECTIONS: "3"
      RETAIL_DB_CRITICAL_CONNECTIONS: "4"
      GRACEFUL_SHUTDOWN_TIMEOUT: "90"
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?required}@db:5432/litellm?connection_limit=10
      RETAIL_DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?required}@db:5432/litellm
    depends_on:
      retail-redis:
        condition: service_healthy
    volumes:
      - ../litellm/deploy/retail/config.yaml:/app/config.yaml:ro
      - ../litellm/litellm/proxy/retail:/app/.venv/lib/python3.13/site-packages/litellm/proxy/retail:ro
      - ../litellm/litellm/integrations/otel/runtime.py:/app/.venv/lib/python3.13/site-packages/litellm/integrations/otel/runtime.py:ro
      - ../litellm/litellm/proxy/common_request_processing.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/common_request_processing.py:ro
      - ../litellm/litellm/proxy/common_utils/user_api_key_cache.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/common_utils/user_api_key_cache.py:ro
      - ../litellm/litellm/proxy/common_utils/http_parsing_utils.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/common_utils/http_parsing_utils.py:ro
      - ../litellm/litellm/router.py:/app/.venv/lib/python3.13/site-packages/litellm/router.py:ro
      - ../litellm/litellm/litellm_core_utils/request_trace_transport.py:/app/.venv/lib/python3.13/site-packages/litellm/litellm_core_utils/request_trace_transport.py:ro
      - ../litellm/litellm/litellm_core_utils/logging_worker.py:/app/.venv/lib/python3.13/site-packages/litellm/litellm_core_utils/logging_worker.py:ro
      - ../litellm/litellm/litellm_core_utils/streaming_handler.py:/app/.venv/lib/python3.13/site-packages/litellm/litellm_core_utils/streaming_handler.py:ro
      - ../litellm/litellm/llms/custom_httpx/http_handler.py:/app/.venv/lib/python3.13/site-packages/litellm/llms/custom_httpx/http_handler.py:ro
      - ../litellm/litellm/llms/vertex_ai/gemini/vertex_and_google_ai_studio_gemini.py:/app/.venv/lib/python3.13/site-packages/litellm/llms/vertex_ai/gemini/vertex_and_google_ai_studio_gemini.py:ro
      - ../litellm/litellm/llms/openai/common_utils.py:/app/.venv/lib/python3.13/site-packages/litellm/llms/openai/common_utils.py:ro
      - ../litellm/litellm/proxy/proxy_server.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/proxy_server.py:ro
      - ../litellm/litellm/proxy/utils.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/utils.py:ro
      - ../litellm/litellm/proxy/_types.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/_types.py:ro
      - ../litellm/litellm/proxy/auth/route_checks.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/auth/route_checks.py:ro
      - ../litellm/litellm/proxy/spend_tracking/spend_management_endpoints.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/spend_tracking/spend_management_endpoints.py:ro
      - ../litellm/litellm/proxy/spend_tracking/spend_tracking_utils.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/spend_tracking/spend_tracking_utils.py:ro
      - ../litellm/litellm/proxy/management_endpoints/daily_activity_routes.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/management_endpoints/daily_activity_routes.py:ro
      - ../litellm/litellm/proxy/management_endpoints/internal_user_endpoints.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/management_endpoints/internal_user_endpoints.py:ro
      - ../litellm/litellm/types/utils.py:/app/.venv/lib/python3.13/site-packages/litellm/types/utils.py:ro
      - ../litellm/litellm/utils.py:/app/.venv/lib/python3.13/site-packages/litellm/utils.py:ro
      - ../litellm/litellm/cost_calculator.py:/app/.venv/lib/python3.13/site-packages/litellm/cost_calculator.py:ro
      - ../litellm/litellm/litellm_core_utils/llm_cost_calc/utils.py:/app/.venv/lib/python3.13/site-packages/litellm/litellm_core_utils/llm_cost_calc/utils.py:ro
      - ../litellm/litellm/litellm_core_utils/llm_response_utils/convert_dict_to_response.py:/app/.venv/lib/python3.13/site-packages/litellm/litellm_core_utils/llm_response_utils/convert_dict_to_response.py:ro
      - ../litellm/litellm/litellm_core_utils/streaming_chunk_builder_utils.py:/app/.venv/lib/python3.13/site-packages/litellm/litellm_core_utils/streaming_chunk_builder_utils.py:ro
      - ../litellm/litellm/responses/utils.py:/app/.venv/lib/python3.13/site-packages/litellm/responses/utils.py:ro
      - ../litellm/litellm/responses/litellm_completion_transformation/transformation.py:/app/.venv/lib/python3.13/site-packages/litellm/responses/litellm_completion_transformation/transformation.py:ro
      - ../litellm/litellm/types/llms/anthropic.py:/app/.venv/lib/python3.13/site-packages/litellm/types/llms/anthropic.py:ro
      - ../litellm/litellm/types/llms/anthropic_messages/anthropic_response.py:/app/.venv/lib/python3.13/site-packages/litellm/types/llms/anthropic_messages/anthropic_response.py:ro
      - ../litellm/litellm/llms/anthropic/pass_through/adapters/transformation.py:/app/.venv/lib/python3.13/site-packages/litellm/llms/anthropic/pass_through/adapters/transformation.py:ro
      - ../litellm/litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:/app/.venv/lib/python3.13/site-packages/litellm/llms/anthropic/pass_through/adapters/streaming_iterator.py:ro
      - ../litellm/litellm/proxy/pass_through_endpoints/llm_provider_handlers/anthropic_passthrough_logging_handler.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/pass_through_endpoints/llm_provider_handlers/anthropic_passthrough_logging_handler.py:ro
      - ../litellm/litellm/main.py:/app/.venv/lib/python3.13/site-packages/litellm/main.py:ro
      - ../litellm/litellm/llms/anthropic/common_utils.py:/app/.venv/lib/python3.13/site-packages/litellm/llms/anthropic/common_utils.py:ro
      - ../litellm/litellm/llms/anthropic/chat/handler.py:/app/.venv/lib/python3.13/site-packages/litellm/llms/anthropic/chat/handler.py:ro
      - ../litellm/litellm/llms/anthropic/pass_through/messages/transformation.py:/app/.venv/lib/python3.13/site-packages/litellm/llms/anthropic/pass_through/messages/transformation.py:ro
      - ../litellm/litellm/proxy/management_endpoints/key_management_endpoints.py:/app/.venv/lib/python3.13/site-packages/litellm/proxy/management_endpoints/key_management_endpoints.py:ro
      - ../litellm/litellm/integrations/custom_logger.py:/app/.venv/lib/python3.13/site-packages/litellm/integrations/custom_logger.py:ro
      - ../litellm/litellm/litellm_core_utils/litellm_logging.py:/app/.venv/lib/python3.13/site-packages/litellm/litellm_core_utils/litellm_logging.py:ro
      - ../litellm/ui/litellm-dashboard/out:/app/.venv/lib/python3.13/site-packages/litellm/proxy/_experimental/out:ro
  retail-redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: "${RETAIL_REDIS_PASSWORD:?required}"
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$${REDISCLI_AUTH}" --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - retail_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  retail_redis_data:
