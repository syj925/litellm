model_list: []
litellm_settings:
  enable_redis_auth_cache: false
  callbacks:
    - litellm.proxy.retail.billing.wallet_callback
    - litellm.proxy.retail.model_observations.model_observation_callback
    - litellm.proxy.retail.cache_observations.cache_observation_callback
general_settings:
  enable_chat_ui: true
  coordination_redis:
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
